<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sensitive Data Test Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 400px;
      margin: 40px auto;
      padding: 0 16px;
    }
    h1 {
      font-size: 20px;
    }
    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 4px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      margin-top: 20px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Test Registration Form</h1>
  <p>Use this page to test the "Detect Sensitive Data" button in the extension.</p>

  <form>
    <label for="fullName">Name</label>
    <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" />

    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" />

    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" />

    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="Enter your password" />

    <label for="aadhaar">Aadhaar Number</label>
    <input type="text" id="aadhaar" name="aadhaar" placeholder="Enter your 12-digit Aadhaar number" />

    <label for="pan">PAN Number</label>
    <input type="text" id="pan" name="pan" placeholder="Enter your PAN number" />

    <button type="submit">Submit</button>
  </form>
</body>
</html>
